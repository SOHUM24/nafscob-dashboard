# Render Blueprint — one-click deploy from GitHub
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: nafscob-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT --timeout 180 --workers 1
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: FLASK_DEBUG
        value: "0"
      - key: RENDER
        value: "true"
